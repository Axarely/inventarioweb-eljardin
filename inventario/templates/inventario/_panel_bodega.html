{# Panel lateral de contexto (Fig. 15 y 16): existencia actual del producto en bodega. #}
<div class="card panel-existencia" id="panel-bodega" data-url="{% url 'inventario:existencia_bodega' %}" aria-live="polite">
  <div class="card-body">
    <h2 class="h6">{{ titulo_panel }}</h2>
    <p class="display-6 titulo-primario mb-0" id="panel-cantidad">—</p>
    <p class="small text-muted mb-2" id="panel-minimo">Seleccione un producto.</p>
    <span id="panel-pill"></span>
    {% if nota_panel %}<hr><p class="small text-muted mb-0">{{ nota_panel }}</p>{% endif %}
  </div>
</div>
