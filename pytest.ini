[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py
testpaths = tests autenticacion usuarios proveedores inventario alertas reportes
addopts = -ra --strict-markers
markers =
    humo: pruebas de humo del entorno (Fase 1)
    unitaria: prueba unitaria
    integracion: prueba de integración entre módulos
    sistema: prueba de sistema end-to-end
