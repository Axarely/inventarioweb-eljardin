# Blueprint de Render (DEDS 3.1 y Fig. 10): servidor de aplicación + PostgreSQL 16.
# Pasos completos en docs/manual_despliegue.md.
databases:
  - name: inventarioweb-db
    databaseName: inventarioweb
    user: inventarioweb
    postgresMajorVersion: "16"
    plan: free   # ATENCIÓN: la BD gratuita de Render vence a los 30 días (ver manual, sección Riesgos)

services:
  - type: web
    name: inventarioweb-eljardin
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: inventarioweb-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Correo SMTP para RF-16: se completan en el panel de Render (no se versionan).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Carga inicial opcional en el build (el plan gratuito no tiene consola):
      - key: DEMO_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_CORREO
        sync: false
      - key: DJANGO_SUPERUSER_NOMBRE
        value: Administrador
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
